<!doctype html>
<html lang="pt-BR" class="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Pointly — planning poker sem cadastro. Crie uma sala, compartilhe o código e estime com o time em tempo real."
		/>
		<meta name="theme-color" content="#F4F6F3" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#141D19" media="(prefers-color-scheme: dark)" />
		<link rel="icon" type="image/svg+xml" href="/icon.svg" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Pointly — Planning poker sem cadastro" />
		<meta
			property="og:description"
			content="Pointly — planning poker sem cadastro. Crie uma sala, compartilhe o código e estime com o time em tempo real."
		/>
		<meta property="og:image" content="/images/planning-cards.webp" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Pointly — Planning poker sem cadastro" />
		<meta
			name="twitter:description"
			content="Pointly — planning poker sem cadastro. Crie uma sala, compartilhe o código e estime com o time em tempo real."
		/>
		<meta name="twitter:image" content="/images/planning-cards.webp" />
		<title>Pointly — Planning poker sem cadastro</title>
		<script>
			try {
				var stored = localStorage.getItem("pointly-theme");
				if (
					stored === "light" ||
					(stored !== "dark" &&
						window.matchMedia("(prefers-color-scheme: light)").matches)
				) {
					document.documentElement.classList.remove("dark");
				} else {
					document.documentElement.classList.add("dark");
				}
			} catch (e) {
				document.documentElement.classList.add("dark");
			}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
