<!doctype html>
<html lang="pt-BR" class="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!-- description/OG/Twitter/canonical por rota são injetados no build
		     (vite-prerender-plugin + src/seo/routes.ts). Esta é a base do shell. -->
		<meta name="theme-color" content="#F6F2E9" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" type="image/svg+xml" href="/icon.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<!-- F0.1: fontes críticas (latin) com preload; latin-ext carrega sob demanda. -->
		<link
			rel="preload"
			href="/fonts/archivo-var-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/instrument-sans-var-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<title>Pointly — Planning poker sem cadastro</title>
		<script>
			/* Espelha lib/theme.ts: resolve (manual > sistema) e escreve os dois
			   contratos — .dark (telas antigas) e data-theme (tokens Prensa). */
			try {
				var stored = localStorage.getItem("pointly-theme");
				var theme =
					stored === "light" || stored === "dark"
						? stored
						: window.matchMedia("(prefers-color-scheme: light)").matches
							? "light"
							: "dark";
				document.documentElement.classList.toggle("dark", theme === "dark");
				document.documentElement.dataset.theme = theme;
			} catch (e) {
				document.documentElement.classList.add("dark");
				document.documentElement.dataset.theme = "dark";
			}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
