<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>Pointly brand asset source</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; color: #171717; background: #fff; font-family: Geist, sans-serif; font-weight: 500; }
      #logo { width: 512px; height: 512px; display: grid; place-items: center; background: #f5f5f5; }
      #logo img { width: 288px; height: 288px; }
      #og { position: relative; width: 1200px; height: 630px; padding: 56px 64px; background: #f5f5f5; }
      .brand { display: flex; align-items: center; gap: 14px; font-size: 38px; letter-spacing: -.04em; }
      .brand img { width: 42px; height: 42px; }
      h1 { margin: 76px 0 24px; font-size: 76px; line-height: 1; letter-spacing: -.04em; font-weight: 500; text-transform: uppercase; }
      p, footer { font: 500 18px/1.6 'Geist Mono', monospace; }
      p { margin: 0; color: #525252; }
      footer { position: absolute; bottom: 42px; left: 64px; right: 64px; padding-top: 20px; border-top: 1px solid #c9c9c9; display: flex; justify-content: space-between; }
    </style>
    <script type="module">
      import "@fontsource/geist/latin-500.css";
      import "@fontsource/geist-mono/latin-500.css";
    </script>
  </head>
  <body>
    <section id="logo" aria-label="Pointly logo"><img src="/favicon.svg" alt="Pointly" /></section>
    <section id="og" aria-label="Pointly social preview">
      <div class="brand"><img src="/favicon.svg" alt="" />pointly</div>
      <h1>Ideias diferentes.<br />Na mesma mesa.</h1>
      <p>Planning poker para times ágeis.</p>
      <footer><span>Grátis. Sem cadastro. Até 12 pessoas.</span><span>pointly.space</span></footer>
    </section>
  </body>
</html>
