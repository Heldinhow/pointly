<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Prévia interativa da arena Pointly" />
    <title>Pointly · Prévia da arena</title>
    <link rel="stylesheet" href="arena.css" />
  </head>
  <body>
    <aside class="review-toolbar" aria-label="Controles da prévia">
      <div class="review-heading">
        <span class="eyebrow">PRÉVIA INTERATIVA</span>
        <span class="review-note">dados demonstrativos</span>
      </div>
      <div class="review-group" role="group" aria-label="Composição">
        <button class="seg active" type="button" data-variant="a" aria-pressed="true">A compacta</button>
        <button class="seg" type="button" data-variant="b" aria-pressed="false">B ampla</button>
      </div>
      <label class="review-field">Participantes
        <select id="players" data-review-control="players">
          <option value="1">1 participante</option><option value="6">6 participantes</option><option value="12">12 participantes</option>
        </select>
      </label>
      <label class="review-field">Cenário
        <select id="scenario" data-review-control="scenario">
          <option value="solo">Solo / convite</option><option value="partial" selected>Votação em andamento</option><option value="ready">Pronto para revelar</option><option value="revealed">Resultados revelados</option>
        </select>
      </label>
      <label class="check"><input id="disconnected" type="checkbox" data-review-control="disconnected" /> <span>Simular desconexão</span></label>
      <button id="theme-toggle" class="theme-toggle" type="button" data-review-control="theme" aria-pressed="false">Tema escuro</button>
    </aside>

    <main class="app-shell" id="app">
      <header class="site-header">
        <a class="brand" href="#" aria-label="Pointly, início"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="6" y="5" width="15" height="22" rx="2.5"/><rect x="12" y="5" width="15" height="22" rx="2.5" fill="var(--bg)"/><path d="m19.5 12.5 2.5 3.5-2.5 3.5L17 16Z"/></svg><span>pointly</span></a>
        <div class="header-actions"><span class="room-code"><span class="room-label">SALA</span> <b>H94F</b></span><button class="invite-btn" id="invite" type="button">Copiar convite</button></div>
      </header>

      <section class="stage" data-variant="a" aria-label="Arena de estimativa">
        <div class="stage-intro"><h1>Arena de estimativa</h1><p class="stage-caption">Escolha uma carta. Revelem juntos.</p></div>
        <div class="arena-wrap">
          <div class="round-summary">
          <div class="summary summary-round"><span>RODADA</span><strong id="round-number">01</strong></div>
          <div class="summary summary-progress"><span>VOTOS</span><strong id="progress">3 de 6</strong></div>
          <div class="timer" aria-label="Tempo restante demonstrativo"><span id="timer-value">60s</span><small>restantes</small></div>
          </div>
          <div class="felt" data-testid="arena-table">
            <div class="felt-header"><span class="felt-label">PLANNING POKER</span><span class="felt-code">H94F</span></div>
            <div class="table-center" data-testid="table-center"><div id="center-copy"></div><div class="round-action" data-testid="round-action"><button id="round-button" type="button">Revelar votos</button><span id="round-hint" aria-live="polite">3 de 6 votaram.</span></div></div>
            <div id="seats" class="seats" aria-label="Participantes"></div>
          </div>
        </div>
        <div class="deck-area"><div class="deck-copy"><span class="kicker">SUA ESTIMATIVA</span><p id="deck-feedback" aria-live="polite">Seu voto fica privado até a revelação.</p></div><div class="deck" id="deck" data-testid="deck" role="group" aria-label="Cartas de estimativa"></div><div id="mobile-actions"></div></div>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
      </section>
    </main>
    <script src="arena.js"></script>
  </body>
</html>
